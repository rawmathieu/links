<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAW.MATHIEU — Photographe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root{
    --bg:#0a0608;
    --fg:#f0e8e6;
    --accent:#b82e3c;
    --accent2:#7a1f2e;
    --muted:#6a4550;
    --card:rgba(184,46,60,.04);
    --card-hover:rgba(184,46,60,.08);
    --border:rgba(184,46,60,.10);
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Outfit',system-ui,sans-serif;
  }

  [data-theme="light"]{
    --bg:#f5f0ee;
    --fg:#1a0c10;
    --accent:#9b1b2a;
    --accent2:#c43a4a;
    --muted:#8a6570;
    --card:rgba(154,27,42,.06);
    --card-hover:rgba(154,27,42,.10);
    --border:rgba(154,27,42,.12);
  }

  html{scroll-behavior:smooth;font-size:16px}

  body{
    background:var(--bg);
    color:var(--fg);
    font-family:var(--sans);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    transition:background .5s ease,color .5s ease;
  }

  body::before{
    content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;
    opacity:.035;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size:128px 128px;
  }

  .ambient{
    position:fixed;top:-30%;left:-10%;width:60vw;height:60vw;
    background:radial-gradient(circle,rgba(184,46,60,.07) 0%,transparent 70%);
    pointer-events:none;z-index:0;
    animation:drift 20s ease-in-out infinite alternate;
  }
  .ambient-2{
    position:fixed;bottom:-20%;right:-10%;width:50vw;height:50vw;
    background:radial-gradient(circle,rgba(122,31,46,.05) 0%,transparent 70%);
    pointer-events:none;z-index:0;
    animation:drift2 25s ease-in-out infinite alternate;
  }
  @keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(5vw,8vh)}}
  @keyframes drift2{0%{transform:translate(0,0)}100%{transform:translate(-4vw,-6vh)}}

  .container{
    position:relative;z-index:1;
    max-width:480px;margin:0 auto;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:60px 24px 40px;
  }

  .avatar-ring{
    width:110px;height:110px;border-radius:50%;
    padding:3px;
    background:linear-gradient(135deg,var(--accent),var(--accent2),var(--muted));
    opacity:0;animation:fadeUp .8s .2s ease-out forwards;
  }
  .avatar{
    width:100%;height:100%;border-radius:50%;
    background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}

  .name{
    font-family:var(--serif);font-size:clamp(28px,6vw,36px);
    font-weight:300;letter-spacing:6px;text-transform:uppercase;
    margin-top:28px;
    opacity:0;animation:fadeUp .8s .4s ease-out forwards;
  }
  .name span{
    background:linear-gradient(135deg,var(--fg),var(--accent));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
  }

  .tagline{
    font-family:var(--sans);font-weight:200;font-size:13px;
    letter-spacing:4px;text-transform:uppercase;
    color:var(--muted);margin-top:10px;
    opacity:0;animation:fadeUp .8s .55s ease-out forwards;
  }

  .divider{
    width:40px;height:1px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    margin:28px 0;
    opacity:0;animation:fadeUp .8s .65s ease-out forwards;
  }

  .links{width:100%;display:flex;flex-direction:column;gap:14px;margin-top:4px}

  .link-card{
    display:flex;align-items:center;gap:16px;
    width:100%;padding:18px 22px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    cursor:pointer;
    text-decoration:none;color:var(--fg);
    transition:all .4s cubic-bezier(.22,1,.36,1);
    position:relative;overflow:hidden;
    opacity:0;transform:translateY(20px);
  }
  .link-card:nth-child(1){animation:fadeUp .7s .75s ease-out forwards}
  .link-card:nth-child(2){animation:fadeUp .7s .85s ease-out forwards}
  .link-card:nth-child(3){animation:fadeUp .7s .95s ease-out forwards}
  .link-card:nth-child(4){animation:fadeUp .7s 1.05s ease-out forwards}

  .link-card::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,rgba(184,46,60,.08),transparent);
    opacity:0;transition:opacity .4s ease;
  }
  .link-card:hover::before{opacity:1}
  .link-card:hover{
    transform:translateY(-3px);
    border-color:rgba(184,46,60,.25);
    background:var(--card-hover);
    box-shadow:0 8px 32px rgba(184,46,60,.1);
  }

  .link-icon{
    width:42px;height:42px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    border-radius:10px;
    background:rgba(255,255,255,.04);
    transition:all .4s ease;
  }
  [data-theme="light"] .link-icon{background:rgba(0,0,0,.04)}
  .link-card:hover .link-icon{
    background:rgba(184,46,60,.14);
    transform:scale(1.05);
  }
  .link-icon svg{width:20px;height:20px;fill:var(--accent);transition:all .3s ease}
  .link-card:hover .link-icon svg{fill:var(--fg)}

  .link-info{flex:1}
  .link-title{font-family:var(--sans);font-weight:400;font-size:15px;letter-spacing:.5px}
  .link-sub{font-size:12px;color:var(--muted);font-weight:200;letter-spacing:.3px;margin-top:2px}

  .link-arrow{width:20px;height:20px;flex-shrink:0;opacity:.2;transition:all .4s ease}
  .link-card:hover .link-arrow{opacity:.6;transform:translateX(3px)}
  .link-arrow svg{width:100%;height:100%;stroke:var(--fg);fill:none;stroke-width:1.5}

  .overlay{
    position:fixed;inset:0;z-index:100;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;
    transition:all .4s ease;padding:20px;
  }
  [data-theme="light"] .overlay{background:rgba(255,255,255,.6)}
  .overlay.active{opacity:1;visibility:visible}

  .popup{
    background:linear-gradient(160deg,#13080a,#1a0f12);
    border:1px solid var(--border);
    border-radius:20px;padding:40px 36px;
    max-width:400px;width:100%;text-align:center;
    transform:scale(.92) translateY(20px);
    transition:all .45s cubic-bezier(.22,1,.36,1);
    position:relative;
  }
  [data-theme="light"] .popup{background:linear-gradient(160deg,#fff,#f8f2f0)}
  .overlay.active .popup{transform:scale(1) translateY(0)}

  .popup-close{
    position:absolute;top:16px;right:16px;
    width:32px;height:32px;border:none;background:rgba(255,255,255,.06);
    border-radius:8px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .3s ease;
  }
  .popup-close:hover{background:rgba(255,255,255,.12)}
  [data-theme="light"] .popup-close{background:rgba(0,0,0,.05)}
  [data-theme="light"] .popup-close:hover{background:rgba(0,0,0,.1)}
  .popup-close svg{width:14px;height:14px;stroke:var(--muted);stroke-width:2;fill:none}

  .popup-icon{
    width:56px;height:56px;margin:0 auto 20px;
    border-radius:14px;
    background:rgba(184,46,60,.12);
    display:flex;align-items:center;justify-content:center;
  }
  .popup-icon svg{width:24px;height:24px;fill:var(--accent)}

  .popup h3{font-family:var(--serif);font-weight:300;font-size:22px;letter-spacing:2px;margin-bottom:8px}
  .popup p{font-size:13px;color:var(--muted);font-weight:200;line-height:1.6;margin-bottom:24px}
  .popup-email{
    display:inline-flex;align-items:center;gap:10px;
    padding:14px 28px;
    background:rgba(184,46,60,.08);
    border:1px solid rgba(184,46,60,.18);
    border-radius:10px;
    font-family:var(--sans);font-size:14px;font-weight:300;
    color:var(--accent);letter-spacing:1px;
    text-decoration:none;transition:all .3s ease;
  }
  .popup-email:hover{
    background:rgba(184,46,60,.16);
    border-color:rgba(184,46,60,.35);
    transform:translateY(-1px);
  }
  .popup-copy{
    display:block;margin-top:14px;
    font-size:11px;color:var(--muted);font-weight:200;
    cursor:pointer;border:none;background:none;
    letter-spacing:1px;text-transform:uppercase;
    transition:color .3s;width:100%;
  }
  .popup-copy:hover{color:var(--accent)}

  .footer{
    margin-top:auto;padding-top:40px;text-align:center;
    opacity:0;animation:fadeUp .8s 1.3s ease-out forwards;
  }
  .footer-line{
    width:30px;height:1px;margin:0 auto 16px;
    background:linear-gradient(90deg,transparent,var(--border),transparent);
  }
  .footer p{font-size:11px;color:var(--muted);font-weight:200;letter-spacing:3px;text-transform:uppercase}

  @keyframes fadeUp{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
  }

  @media(min-width:768px){
    .container{padding:80px 24px 50px}
    .link-card{padding:20px 26px}
    .link-card:hover{transform:translateY(-4px) scale(1.01)}
  }
  @media(min-width:1024px){.container{max-width:520px;padding:100px 24px 60px}}
  @media(max-width:380px){
    .container{padding:44px 16px 30px}
    .avatar-ring{width:90px;height:90px}
    .name{letter-spacing:4px}
    .link-card{padding:15px 16px;gap:12px}
    .link-icon{width:38px;height:38px}
    .popup{padding:30px 24px}
  }

  .toast{
    position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
    background:linear-gradient(135deg,#1e0f12,#251418);
    border:1px solid rgba(184,46,60,.25);
    border-radius:10px;padding:12px 24px;
    font-size:13px;font-weight:300;letter-spacing:1px;color:var(--accent);
    opacity:0;transition:all .4s cubic-bezier(.22,1,.36,1);
    pointer-events:none;z-index:200;
    box-shadow:0 8px 32px rgba(0,0,0,.4);
  }
  [data-theme="light"] .toast{
    background:linear-gradient(135deg,#fff,#f8f2f0);
    box-shadow:0 8px 32px rgba(0,0,0,.1);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .cursor-glow{
    position:fixed;width:300px;height:300px;
    border-radius:50%;pointer-events:none;z-index:0;
    background:radial-gradient(circle,rgba(184,46,60,.04) 0%,transparent 70%);
    transform:translate(-50%,-50%);
    transition:left .5s ease,top .5s ease;
    display:none;
  }
  @media(hover:hover){.cursor-glow{display:block}}

  .theme-toggle{
    position:fixed;top:20px;right:20px;z-index:50;
    width:42px;height:42px;
    border:1px solid var(--border);
    border-radius:50%;cursor:pointer;
    background:var(--card);
    display:flex;align-items:center;justify-content:center;
    transition:all .4s cubic-bezier(.22,1,.36,1);
    opacity:0;animation:fadeUp .8s .3s ease-out forwards;
  }
  .theme-toggle:hover{
    background:var(--card-hover);
    transform:scale(1.1);
  }
  .theme-toggle svg{
    width:18px;height:18px;
    stroke:var(--accent);fill:none;stroke-width:1.5;
    transition:all .3s ease;
  }
  .theme-toggle .icon-sun{display:none}
  [data-theme="light"] .theme-toggle .icon-sun{display:block}
  [data-theme="light"] .theme-toggle .icon-moon{display:none}
</style>
</head>
<body>

  <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
</button>

<script>
  function toggleTheme(){
    var current = document.documentElement.getAttribute('data-theme');
    var next = current === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('theme', next); }catch(e){}
  }
  (function(){
    try{
      var saved = localStorage.getItem('theme');
      if(saved) document.documentElement.setAttribute('data-theme', saved);
    }catch(e){}
  })();

  var glow = document.getElementById('cursorGlow');
  document.addEventListener('mousemove', function(e){
    glow.style.left = e.clientX + 'px';
    glow.style.top = e.clientY + 'px';
  });

  function openMail(){
    document.getElementById('overlay').classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function closeMail(e){
    if(e && e.target !== e.currentTarget) return;
    document.getElementById('overlay').classList.remove('active');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeMail();
  });

  function copyEmail(){
    navigator.clipboard.writeText('contact@rawmathieu.com').then(function(){
      var toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(function(){ toast.classList.remove('show'); }, 2200);
    });
  }
</script>
